    <script type="text/javascript" src="/static/js/list.js"></script>
    <style>
        .card{
            width:500px;
            max-width:500px; 
            display: inline-block;
            height: 250px;
            max-height: 250px;
            z-index: 2;  
            border: 1px solid #333;
            box-shadow: 8px 8px 5px #444;
            padding: 8px 12px;
            background-image: linear-gradient(180deg, #fff, #ddd 40%, #ccc);
            place-items: flex-end normal ;
            display: grid;
            
        }
        .card-value{
            text-align: right;
        }

        .card-header{
            text-align: center;
        }

        .take-part-button{
            place-self: end center;
        }
    </style>
    <div class="container card">
        <div class="row  align-items-center">
            <div class="col-sm card-header">
                    {{ .Element.Event.Name }}
            </div>
        </div>
        <div class="row  align-items-center">
            <div class="col-sm">
                Дата проведения:
            </div>
            <div class="col-sm card-value" >
                <span>
                    {{ readableDate .Element.Event.Date }}
                </span>
            </div>
        </div>
        <div class="row  align-items-center">
            <div class="col-sm">
                <span>
                    Место проведения:
                </span>
            </div>
            <div class="col-sm card-value" >
                <span>
                    {{ .Element.Event.Location }}
                </span>
            </div>
        </div>
        <div class="row  align-items-center">
            <div class="col-sm">
                <span>
                    Ответсвенный:
                </span>
            </div>
            <div class="col-sm card-value overflow text-truncate" style="text-overflow: ellipsis;">
                <span>
                    {{ .Element.Responsible}}
                </span>
            </div>
        </div>
        <div class="row  align-items-center">
            <div class="col-sm">
                <span>
                    Описание:
                </span>
            </div>
            <div class="col-sm card-value overflow text-truncate" style="text-overflow: ellipsis;">
                <span>
                    {{ .Element.Event.Description }}
                </span>
            </div>
        </div>
        <div class="container-fluid">
            <button id="button{{.Element.Event.Id}}" onclick="takePartClicked(this)" data-id="{{.Element.Event.Id}}" class="btn btn-sm btn-primary btn-block {{if .Element.IsTakePart}} btn-success {{end}}" {{ if .Element.IsExpired }} disabled {{end}}>Принять участие</span>
        </div>
        <div class="container-fluid text-right">
            <a  href="/events/participants?eid={{.Element.Event.Id}}">Участники</a>
            <button type="button" style=" margin-bottom: 4px;" class="btn btn-link" data-toggle="modal" data-target="#leaveFeedback" data-whatever="{{.Element.Event.Name}}" data-eventid="{{.Element.Event.Id}}">Оставить отзыв</button>
            <button type="button" style=" margin-bottom: 4px;" class="btn btn-link" data-toggle="modal" data-target="#showFeedbacks" data-whatever="{{.Element.Event.Name}}" data-eventid="{{.Element.Event.Id}}">Отзывы</button>
            {{if .IsAdmin}}
            <button onclick="deleteEvent('{{.Element.Event.Id}}')" type="button" style=" margin-bottom: 4px;" class="btn btn-link">Удалить</button>
            {{end}}
        </div>






    </div>
